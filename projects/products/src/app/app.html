<div class="flex flex-wrap gap-4 mt-4">
  @for (product of productsResponse().products; track product.id) {
    <div
      class="max-w-sm bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-lg transition-shadow duration-300 overflow-hidden flex flex-col h-full"
    >
      <!-- Product Image -->
      <div class="h-56 bg-gray-100 flex justify-center items-center overflow-hidden pt-1">
        <img
          class="w-full h-full object-contain transition-transform duration-300 hover:scale-105"
          [src]="product.thumbnail"
          [alt]="product.title"
        />
      </div>

      <!-- Product Details -->
      <div class="p-5 flex flex-col flex-grow">
        <!-- Title -->
        <h3 class="text-lg font-bold tracking-tight text-gray-900 mb-2">
          {{ product.title }}
        </h3>

        <!-- Description (Truncated to 2 lines) -->
        <p class="text-sm text-gray-600 line-clamp-2 mb-4 flex-grow">
          {{ product.description }}
        </p>

        <!-- Price & Action Button -->
        <div class="flex items-center justify-between mt-auto pt-4 border-t border-gray-100">
          <span class="text-xl font-extrabold text-gray-900">
            {{ product.price }}
          </span>

          <button
            (click)="addToCart(product)"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 transition-colors"
          >
            Add to cart
          </button>
        </div>
      </div>
    </div>
  }
</div>
